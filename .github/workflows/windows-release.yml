name: Windows stable build (build-only)

on:
  push:
    branches: [codex/windows-beta6-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify the exact source commit and stable version
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "0.2.3"
          node -e "fetch('https://api.github.com/repos/ct-jyjntc/opentype-public/commits/' + process.env.RELEASE_SHA, {headers:{'User-Agent':'OpenType-release-builder','Authorization':'Bearer ' + process.env.RELEASE_GITHUB_TOKEN}}).then(async r => { if (!r.ok || (await r.json()).sha !== process.env.RELEASE_SHA) process.exit(1) })"
      - name: Download and verify pinned SenseVoice model
        env:
          SENSEVOICE_MODEL_DIR: tmp/release-${{ github.run_id }}/models/sensevoice-int8
        run: node scripts/prepare-release-model.mjs
      - name: Retain one verified model copy for both architecture jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SenseVoice-model-${{ github.sha }}
          path: tmp/release-${{ github.run_id }}/models/sensevoice-int8/
          if-no-files-found: error
          retention-days: 3

  package-windows:
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up native-architecture Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify stable source and runner architecture
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:RELEASE_SHA) { throw 'Checkout does not match the workflow source commit.' }
          $remote = Invoke-RestMethod -Headers @{ 'User-Agent'='OpenType-release-builder'; 'Authorization'="Bearer $env:RELEASE_GITHUB_TOKEN" } -Uri "https://api.github.com/repos/ct-jyjntc/opentype-public/commits/$env:RELEASE_SHA"
          if ($remote.sha -ne $env:RELEASE_SHA) { throw 'The source commit is not confirmed by the GitHub API.' }
          if ((node -p 'process.arch').Trim() -ne $env:EXPECTED_ARCH) { throw 'Node is not running natively for the package architecture.' }
          if ((node -p "require('./package.json').version").Trim() -ne '0.2.3') { throw 'The package version is not 0.2.3.' }
      - name: Restore the single verified model copy
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v6.0.0
        with:
          name: SenseVoice-model-${{ github.sha }}
          path: tmp/release-${{ github.run_id }}/models/sensevoice-int8
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned Windows-only electron-builder tooling
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $taskDir = Join-Path 'tmp' 'release-${{ github.run_id }}'
          $toolingDir = Join-Path $taskDir 'windows-builder-26.9.0'
          New-Item -ItemType Directory -Path $toolingDir -Force | Out-Null
          Copy-Item 'scripts/windows-stable-builder/package.json' $toolingDir
          Copy-Item 'scripts/windows-stable-builder/package-lock.json' $toolingDir
          npm ci --prefix $toolingDir --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builderPackage = Join-Path $toolingDir 'node_modules/electron-builder/package.json'
          $appBuilderPackage = Join-Path $toolingDir 'node_modules/app-builder-lib/package.json'
          $builderVersion = (Get-Content $builderPackage -Raw | ConvertFrom-Json).version
          $appBuilderVersion = (Get-Content $appBuilderPackage -Raw | ConvertFrom-Json).version
          if ($builderVersion -ne '26.9.0' -or $appBuilderVersion -ne '26.9.0') { throw "Unexpected Windows packaging tool versions: electron-builder=$builderVersion app-builder-lib=$appBuilderVersion" }
          Write-Host "Pinned Windows-only NSIS toolchain: electron-builder=$builderVersion app-builder-lib=$appBuilderVersion arch=$env:PACKAGE_ARCH"
      - name: Build sherpa-onnx for Windows ARM64 and Electron 33
        id: build_sherpa_arm64
        if: ${{ matrix.arch == 'arm64' }}
        run: ./scripts/build-sherpa-windows-arm64.ps1
      - name: Record exact ARM64 native bundle inputs and output hashes
        if: ${{ always() && matrix.arch == 'arm64' && steps.build_sherpa_arm64.outcome == 'success' }}
        shell: pwsh
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $root = (Resolve-Path '.').Path
          $taskDir = Join-Path $root 'tmp/release-${{ github.run_id }}'
          $buildDir = Join-Path $root 'tmp/${{ github.run_id }}-windows-arm64-sherpa'
          $packageDir = Join-Path $root 'node_modules/sherpa-onnx-win-arm64'
          $pinPath = Join-Path $root 'native/sherpa-onnx-win-arm64/source.json'
          $pin = Get-Content $pinPath -Raw | ConvertFrom-Json
          $runtime = Get-Content (Join-Path $buildDir 'electron-runtime.json') -Raw | ConvertFrom-Json
          $ortCmake = Get-Content (Join-Path $buildDir 'sherpa-onnx/cmake/onnxruntime-win-arm64.cmake') -Raw
          $ortHash = [regex]::Match($ortCmake, 'set\(ONNXRUNTIME_HASH_MD_Release "SHA256=([a-f0-9]{64})"\)').Groups[1].Value
          if (-not $ortHash) { throw 'Could not resolve the pinned ONNX Runtime input hash for the ARM64 native bundle manifest.' }
          $packageEntries = @(Get-ChildItem $packageDir -Force -Recurse)
          if ($packageEntries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }) { throw 'Refusing to hash or retain a native package containing reparse-point paths.' }
          $nativeFiles = @(Get-ChildItem $packageDir -File -Recurse | Sort-Object FullName | ForEach-Object {
            [ordered]@{ path=$_.FullName.Substring($packageDir.Length + 1).Replace('\','/'); size=$_.Length; sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() }
          })
          if (-not $nativeFiles.Count) { throw 'The verified ARM64 native package is empty.' }
          $manifest = [ordered]@{
            kind='diagnostic-reusable-native-bundle'; sourceCommit=$env:RELEASE_SHA; targetArch='arm64'
            upstreamRepository=$pin.repository; upstreamTag=$pin.tag; upstreamCommit=$pin.commit
            upstreamSourceJsonSha256=(Get-FileHash -Algorithm SHA256 $pinPath).Hash.ToLowerInvariant()
            onnxRuntimeVersion=$pin.onnxRuntimeVersion; onnxRuntimeMdReleaseSha256=$ortHash
            electronRuntime=$runtime
            rootPackageLockSha256=(Get-FileHash -Algorithm SHA256 (Join-Path $root 'package-lock.json')).Hash.ToLowerInvariant()
            nativeBuildScriptSha256=(Get-FileHash -Algorithm SHA256 (Join-Path $root 'scripts/build-sherpa-windows-arm64.ps1')).Hash.ToLowerInvariant()
            adapterPackageJsonSha256=(Get-FileHash -Algorithm SHA256 (Join-Path $root 'scripts/sherpa-arm64-addon-build/package.json')).Hash.ToLowerInvariant()
            adapterPackageLockSha256=(Get-FileHash -Algorithm SHA256 (Join-Path $root 'scripts/sherpa-arm64-addon-build/package-lock.json')).Hash.ToLowerInvariant()
            files=$nativeFiles
          }
          $manifestPath = Join-Path $taskDir 'windows-arm64-native-bundle-provenance.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $manifestPath -Encoding utf8
          Write-Host "Recorded native bundle source=$($env:RELEASE_SHA) upstream=$($pin.commit) Electron=$($runtime.electron)/$($runtime.nodeAbi) files=$($nativeFiles.Count) provenance=$manifestPath"
      - name: Retain task-only ARM64 native bundle and provenance
        if: ${{ always() && matrix.arch == 'arm64' && steps.build_sherpa_arm64.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenType-Windows-arm64-native-diagnostic-${{ github.sha }}
          path: |
            node_modules/sherpa-onnx-win-arm64/sherpa-onnx.node
            node_modules/sherpa-onnx-win-arm64/*.dll
            node_modules/sherpa-onnx-win-arm64/*.txt
            node_modules/sherpa-onnx-win-arm64/package.json
            node_modules/sherpa-onnx-win-arm64/source.json
            node_modules/sherpa-onnx-win-arm64/BUILD-PROVENANCE.json
            node_modules/sherpa-onnx-win-arm64/LICENSE*
            node_modules/sherpa-onnx-win-arm64/vc-runtime/*
            tmp/${{ github.run_id }}-windows-arm64-sherpa/electron-runtime.json
            tmp/release-${{ github.run_id }}/windows-arm64-native-bundle-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Build native helpers and production app
        shell: pwsh
        env:
          OPENTYPE_NATIVE_ARCH: ${{ matrix.arch }}
          OPENTYPE_PACKAGE_ARCH: ${{ matrix.arch }}
          SENSEVOICE_MODEL_DIR: tmp/release-${{ github.run_id }}/models/sensevoice-int8
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builderCli = Join-Path 'tmp' 'release-${{ github.run_id }}/windows-builder-26.9.0/node_modules/electron-builder/cli.js'
          node $builderCli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $builderCli --config electron-builder.windows.stable.cjs --win nsis --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run packaged Electron 33 and local SenseVoice on a public speech oracle
        id: verify_packaged_asr
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          SENSEVOICE_MODEL_DIR: tmp/release-${{ github.run_id }}/models/sensevoice-int8
        run: |
          $taskDir = Join-Path 'tmp' 'release-${{ github.run_id }}'
          $fixture = Join-Path $taskDir 'librispeech-1272-128104-0000.wav'
          New-Item -ItemType Directory -Path $taskDir -Force | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/venetanji/rt-agent/claude/sharp-volta-wt499g/tests/fixtures/audio/librispeech-1272-128104-0000.wav' -OutFile $fixture
          $digest = (Get-FileHash -Algorithm SHA256 $fixture).Hash.ToLowerInvariant()
          if ($digest -ne '799f78ed4beb4de7ceae3a809262d4ce242394342ccd1d58cef7d49dbc2def46') { throw 'LibriSpeech oracle WAV hash mismatch.' }
          $asrScript = Join-Path $taskDir 'verify-packaged-asr.cjs'
          $asrSource = @'
          const path = require('node:path'), fs = require('node:fs'), { createRequire } = require('node:module');
          (async () => {
            const [wav, expectedArch] = process.argv.slice(2);
            const resultPath = process.env.OPENTYPE_ASR_RESULT;
            if (!resultPath) throw Error('OPENTYPE_ASR_RESULT is required');
            if (process.platform !== 'win32' || process.arch !== expectedArch) throw Error(`wrong runtime ${process.platform}/${process.arch}`);
            const fromApp = createRequire(path.join(process.resourcesPath, 'app.asar', 'dist/main/sensevoice-worker.js'));
            const Database = fromApp('better-sqlite3');
            const db = new Database(':memory:');
            const sqliteProbe = db.prepare('select 1 as value').get(); db.close();
            if (sqliteProbe.value !== 1) throw Error('better-sqlite3 query returned an unexpected result');
            const koffi = fromApp('koffi');
            if (typeof koffi.version !== 'string' || !koffi.version) throw Error('Koffi did not report its loaded version');
            const sherpa = fromApp('sherpa-onnx-node');
            const { OfflineRecognizer } = sherpa;
            const { samples, sampleRate } = sherpa.readWave(wav, false);
            const modelDir = path.join(process.resourcesPath, 'models', 'sensevoice-int8');
            const recognizer = new OfflineRecognizer({ featConfig: { sampleRate: 16000, featureDim: 80 }, modelConfig: {
              senseVoice: { model: path.join(modelDir, 'model.int8.onnx'), language: 'auto', useInverseTextNormalization: 1 },
              tokens: path.join(modelDir, 'tokens.txt'), numThreads: 2, provider: 'cpu', debug: 0 } });
            const parts = [];
            const stream = recognizer.createStream(); stream.acceptWaveform({ samples, sampleRate });
            recognizer.decode(stream); parts.push(String(recognizer.getResult(stream).text ?? '').replace(/<\|[^>]*\|>/g, '').trim());
            const text = parts.filter(Boolean).join(' ');
            const reference = 'MISTER QUILTER IS THE APOSTLE OF THE MIDDLE CLASSES AND WE ARE GLAD TO WELCOME HIS GOSPEL';
            const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
            const a = norm(text), b = norm(reference), row = Array.from({length:b.length+1}, (_,i)=>i);
            for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}
            const wer = row[b.length] / b.length;
            const report = {platform:process.platform,arch:process.arch,electron:process.versions.electron,nodeAbi:process.versions.modules,sqliteQueryValue:sqliteProbe.value,koffiVersion:koffi.version,text,reference,wer};
            fs.writeFileSync(resultPath, JSON.stringify(report, null, 2), { flag: 'wx' });
            console.log(JSON.stringify(report,null,2));
            if(wer>0.25) throw Error(`local SenseVoice WER ${wer.toFixed(3)} exceeds 0.25`);
            recognizer.free?.();
          })().catch(error => { console.error(error); process.exitCode=1 });
          '@
          Set-Content -Path $asrScript -Value $asrSource -Encoding utf8NoBOM
          $output = Join-Path 'release/staging/0.2.3' "windows-$env:PACKAGE_ARCH"
          $unpackedDirName = if ($env:PACKAGE_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          $unpackedRoot = Join-Path $output $unpackedDirName
          Write-Host "Electron Builder unpacked directory for $env:PACKAGE_ARCH`: $unpackedRoot"
          $unpackedExe = Join-Path $unpackedRoot 'OpenType.exe'
          if (-not (Test-Path $unpackedExe)) { throw "electron-builder did not produce the $env:PACKAGE_ARCH unpacked packaged Electron application at $unpackedExe." }
          $addon = Join-Path $unpackedRoot "resources/app.asar.unpacked/node_modules/sherpa-onnx-win-$env:PACKAGE_ARCH/sherpa-onnx.node"
          if (-not (Test-Path $addon)) { throw "Packaged ASR addon is missing: $addon" }
          $installDir = [IO.Path]::GetFullPath((Join-Path 'tmp' 'release-${{ github.run_id }}/installed-${{ matrix.arch }}'))
          $installer = Join-Path $output "OpenType-0.2.3-Windows-$env:PACKAGE_ARCH.exe"
          $installerStarted = Get-Date
          $installerStartError = $null
          $install = $null
          try { $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru -ErrorAction Stop }
          catch { $installerStartError = $_.Exception.ToString() }
          $installerExitCode = if ($null -ne $install) { $install.ExitCode } else { $null }
          $installerDiagnosticDir = Join-Path $taskDir 'installer-diagnostics-arm64'
          New-Item -ItemType Directory -Path $installerDiagnosticDir -Force | Out-Null
          $installerDiagnostic = [ordered]@{
            architecture=$env:PACKAGE_ARCH; startedAt=$installerStarted.ToUniversalTime().ToString('o'); finishedAt=(Get-Date).ToUniversalTime().ToString('o')
            installerName=[IO.Path]::GetFileName($installer); installerSize=(Get-Item $installer).Length
            installerSha256=(Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            processId=$(if ($install) { $install.Id } else { $null }); exitCode=$installerExitCode
            startError=$(if ($installerStartError) { $installerStartError -replace '(?i)C:\\Users\\[^\\]+', '%USERPROFILE%' } else { $null })
          }
          if ($installerExitCode -ne 0) {
            Start-Sleep -Seconds 2
            $events = @(Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=$installerStarted.AddSeconds(-1); Id=@(1000,1001) } -ErrorAction SilentlyContinue | ForEach-Object {
              $message = $_.Message
              $fields = [ordered]@{ faultingApplication=$null; faultingModule=$null; exceptionCode=$null; faultOffset=$null; processId=$null; reportId=$null }
              foreach ($line in ($message -split "`r?`n")) {
                if ($line -match '^\s*Faulting application name:\s*(.+)$') { $fields.faultingApplication=[IO.Path]::GetFileName($Matches[1].Trim()) }
                elseif ($line -match '^\s*Faulting module name:\s*(.+)$') { $fields.faultingModule=[IO.Path]::GetFileName($Matches[1].Trim()) }
                elseif ($line -match '^\s*Exception code:\s*(.+)$') { $fields.exceptionCode=$Matches[1].Trim() }
                elseif ($line -match '^\s*Fault offset:\s*(.+)$') { $fields.faultOffset=$Matches[1].Trim() }
                elseif ($line -match '^\s*Faulting process id:\s*(.+)$') { $fields.processId=$Matches[1].Trim() }
                elseif ($line -match '^\s*Report Id:\s*(.+)$') { $fields.reportId=$Matches[1].Trim() }
              }
              [ordered]@{ time=$_.TimeCreated.ToUniversalTime().ToString('o'); eventId=$_.Id; provider=$_.ProviderName; fields=$fields }
            })
            $installerDiagnostic.events=$events
          }
          $diagnosticPath = Join-Path $installerDiagnosticDir 'installer-run.json'
          $installerDiagnostic | ConvertTo-Json -Depth 8 | Set-Content $diagnosticPath -Encoding utf8
          Write-Host "NSIS install exit=$installerExitCode startError=$($installerDiagnostic.startError) diagnostics=$diagnosticPath"
          if ($installerExitCode -ne 0) { throw "NSIS installer exited with $installerExitCode; sanitized Application Error events saved to $diagnosticPath." }
          $appExe = Join-Path $installDir 'OpenType.exe'
          if (-not (Test-Path $appExe)) { throw 'The NSIS installer did not install the packaged app executable at the requested path.' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $resultFile = [IO.Path]::GetFullPath((Join-Path $taskDir "installed-asr-$env:PACKAGE_ARCH.json"))
          $stdoutLog = [IO.Path]::GetFullPath((Join-Path $taskDir "installed-asr-$env:PACKAGE_ARCH.stdout.txt"))
          $stderrLog = [IO.Path]::GetFullPath((Join-Path $taskDir "installed-asr-$env:PACKAGE_ARCH.stderr.txt"))
          foreach ($path in @($resultFile, $stdoutLog, $stderrLog)) { if (Test-Path $path) { throw "Refusing to reuse prior ASR result or log: $path" } }
          $env:OPENTYPE_ASR_RESULT = $resultFile
          $electronArgs = @('"' + [IO.Path]::GetFullPath($asrScript) + '"', '"' + [IO.Path]::GetFullPath($fixture) + '"', $env:PACKAGE_ARCH)
          $child = Start-Process -FilePath $appExe -ArgumentList $electronArgs -WorkingDirectory $installDir -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $finished = $child.WaitForExit(120000)
          if (-not $finished) { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue; throw "Installed Electron ASR process timed out (PID $($child.Id)); stdout=$stdoutLog stderr=$stderrLog" }
          $child.Refresh()
          $stdoutText = if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw } else { '' }
          $stderrText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { '' }
          Write-Host "Installed Electron ASR exit=$($child.ExitCode) stdout=$stdoutText stderr=$stderrText"
          if ($child.ExitCode -ne 0) { throw "Installed Electron ASR exited with code $($child.ExitCode)." }
          if (-not (Test-Path $resultFile)) { throw 'Installed Electron ASR exited without a fresh JSON result.' }
          $asrResult = Get-Content $resultFile -Raw | ConvertFrom-Json
          Write-Host "Installed Electron ASR result=$($asrResult | ConvertTo-Json -Compress)"
          if ($asrResult.platform -ne 'win32' -or $asrResult.arch -ne $env:PACKAGE_ARCH -or $asrResult.electron -ne '33.4.11' -or $asrResult.nodeAbi -ne '130') { throw 'Installed Electron ASR runtime platform, architecture, version, or ABI did not match the release target.' }
          if ($asrResult.sqliteQueryValue -ne 1 -or $asrResult.koffiVersion -ne '2.16.3') { throw 'Installed SQLite/Koffi runtime probes did not return their expected values.' }
          if ([string]::IsNullOrWhiteSpace($asrResult.text) -or $asrResult.reference -ne 'MISTER QUILTER IS THE APOSTLE OF THE MIDDLE CLASSES AND WE ARE GLAD TO WELCOME HIS GOSPEL' -or $null -eq $asrResult.wer -or [double]$asrResult.wer -gt 0.25) { throw 'Installed SenseVoice result is empty, references the wrong oracle, or exceeded the WER limit.' }
      - name: Retain NSIS installer crash evidence and selected packaged binaries
        if: ${{ always() && matrix.arch == 'arm64' && steps.verify_packaged_asr.outcome != 'success' }}
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $taskDir = Join-Path 'tmp' 'release-${{ github.run_id }}'
          $output = Join-Path 'release/staging/0.2.3' "windows-$env:PACKAGE_ARCH"
          $unpackedDirName = if ($env:PACKAGE_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          $unpackedRoot = Join-Path $output $unpackedDirName
          $diagnosticRoot = Join-Path $taskDir 'installer-diagnostics-arm64'
          New-Item -ItemType Directory -Path $diagnosticRoot -Force | Out-Null
          $installer = Join-Path $output "OpenType-0.2.3-Windows-$env:PACKAGE_ARCH.exe"
          if (Test-Path $installer) { Copy-Item $installer (Join-Path $diagnosticRoot ([IO.Path]::GetFileName($installer))) }
          if (Test-Path $unpackedRoot) {
            $unpackedRootItem = Get-Item -LiteralPath $unpackedRoot -Force
            if (($unpackedRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Refusing to traverse a reparse-point unpacked root: $unpackedRoot" }
            $unpackedRoot = (Resolve-Path -LiteralPath $unpackedRoot).Path
            $resolvedUnpackedItem = Get-Item -LiteralPath $unpackedRoot -Force
            if (($resolvedUnpackedItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Refusing to traverse a reparse-point resolved unpacked root: $unpackedRoot" }
            $nativeRoot = Join-Path $diagnosticRoot 'unpacked-native'
            $pendingDirectories = [Collections.Generic.Stack[string]]::new()
            $pendingDirectories.Push($unpackedRoot)
            $nativeBinaries = [Collections.Generic.List[object]]::new()
            while ($pendingDirectories.Count -gt 0) {
              $directory = $pendingDirectories.Pop()
              foreach ($entry in Get-ChildItem -LiteralPath $directory -Force) {
                if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Refusing to traverse or copy a reparse point from packaged output: $($entry.FullName)" }
                if ($entry.PSIsContainer) { $pendingDirectories.Push($entry.FullName); continue }
                if ($entry.Extension -in @('.dll','.exe','.node')) { $nativeBinaries.Add($entry) }
              }
            }
            foreach ($nativeBinary in $nativeBinaries) {
              $relative = [IO.Path]::GetRelativePath($unpackedRoot, $nativeBinary.FullName)
              if ([IO.Path]::IsPathRooted($relative) -or $relative -eq '..' -or $relative.StartsWith("..$([IO.Path]::DirectorySeparatorChar)")) { throw "Refusing to copy a packaged binary outside the expected unpacked directory: $($nativeBinary.FullName)" }
              $destination = Join-Path $nativeRoot $relative
              New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
              Copy-Item $nativeBinary.FullName $destination
            }
          }
          foreach ($evidenceName in @('installed-asr-arm64.json', 'installed-asr-arm64.stdout.txt', 'installed-asr-arm64.stderr.txt')) {
            $evidencePath = Join-Path $taskDir $evidenceName
            if (Test-Path $evidencePath) { Copy-Item $evidencePath (Join-Path $diagnosticRoot $evidenceName) }
          }
          Write-Host "Retaining task-only installer diagnostics under $diagnosticRoot"
      - name: Upload task-only ARM64 installer failure diagnostics
        if: ${{ always() && matrix.arch == 'arm64' && steps.verify_packaged_asr.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenType-Windows-arm64-installer-diagnostics-${{ github.sha }}
          path: tmp/release-${{ github.run_id }}/installer-diagnostics-arm64/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify PE architectures, NSIS package, update feed, and checksums
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          RELEASE_SHA: ${{ github.sha }}
          SENSEVOICE_MODEL_DIR: tmp/release-${{ github.run_id }}/models/sensevoice-int8
        run: |
          $output = Join-Path 'release/staging/0.2.3' "windows-$env:PACKAGE_ARCH"
          $unpackedDirName = if ($env:PACKAGE_ARCH -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          $unpackedRoot = Join-Path $output $unpackedDirName
          Write-Host "Verifying Electron Builder $env:PACKAGE_ARCH output directory: $unpackedRoot"
          if (-not (Test-Path (Join-Path $unpackedRoot 'OpenType.exe'))) { throw "Electron Builder $env:PACKAGE_ARCH app executable is missing: $unpackedRoot" }
          $installer = Get-ChildItem $output -Filter "OpenType-0.2.3-Windows-$env:PACKAGE_ARCH.exe" -File | Select-Object -First 1
          if (-not $installer) { throw 'Architecture-specific NSIS installer was not produced.' }
          if (-not (Test-Path (Join-Path $output 'latest.yml'))) { throw 'Stable latest.yml was not produced.' }
          $peMachine = { param($path) $bytes = [IO.File]::ReadAllBytes($path); $offset = [BitConverter]::ToInt32($bytes, 0x3c); if ($bytes[$offset] -ne 0x50 -or $bytes[$offset + 1] -ne 0x45 -or $bytes[$offset + 2] -ne 0 -or $bytes[$offset + 3] -ne 0) { throw "Invalid PE file: $path" }; [BitConverter]::ToUInt16($bytes, $offset + 4) }
          $expectedMachine = if ($env:PACKAGE_ARCH -eq 'arm64') { 0xAA64 } else { 0x8664 }
          $nativeFiles = @(Get-ChildItem (Join-Path $unpackedRoot 'resources/app.asar.unpacked') -File -Recurse | Where-Object {
            if ($_.Extension -in @('.dll','.exe')) { return $true }
            if ($_.Extension -ne '.node') { return $false }
            if ($_.FullName -match '[\\/]koffi[\\/]build[\\/]koffi[\\/]') { return $_.FullName -match "[\\/]win32_$env:PACKAGE_ARCH[\\/]koffi\.node$" }
            return $true
          } | ForEach-Object FullName)
          $nativeFiles += @((Join-Path $unpackedRoot 'OpenType.exe'), (Join-Path $unpackedRoot 'resources/lib/windows/build/OpenTypeNative.dll'), (Join-Path $unpackedRoot 'resources/lib/windows/build/OutputAudio.exe'), (Join-Path $unpackedRoot 'resources/lib/windows/build/ClipboardGuard.exe'))
          $nativeFiles += @(Get-ChildItem $unpackedRoot -Filter '*.dll' -File | ForEach-Object FullName)
          foreach ($path in $nativeFiles) {
            if (-not (Test-Path $path)) { throw "Packaged native binary is missing: $path" }
            $machine = & $peMachine $path
            if ($machine -ne $expectedMachine) { throw "PE machine mismatch in $path`: $machine" }
            Write-Host "PE $path machine=0x$('{0:X4}' -f $machine)"
          }
          if ($env:PACKAGE_ARCH -eq 'arm64') {
            $runtimeSource = 'node_modules/sherpa-onnx-win-arm64/vc-runtime'
            $runtimeDlls = @(Get-ChildItem $runtimeSource -Filter '*.dll' -File)
            foreach ($requiredName in @('MSVCP140.dll', 'MSVCP140_1.dll', 'VCRUNTIME140.dll')) {
              if ($requiredName -notin $runtimeDlls.Name) { throw "The staged ARM64 VC runtime is missing $requiredName." }
            }
            $installedDir = Join-Path 'tmp' 'release-${{ github.run_id }}/installed-arm64'
            foreach ($runtimeDll in $runtimeDlls) {
              $packagedRuntime = Join-Path $unpackedRoot $runtimeDll.Name
              $installedRuntime = Join-Path $installedDir $runtimeDll.Name
              foreach ($runtimePath in @($packagedRuntime, $installedRuntime)) {
                if (-not (Test-Path $runtimePath)) { throw "App-local ARM64 VC runtime is missing beside OpenType.exe: $runtimePath" }
                $machine = & $peMachine $runtimePath
                if ($machine -ne 0xAA64) { throw "App-local VC runtime is not ARM64: $runtimePath" }
                $expectedHash = (Get-FileHash -Algorithm SHA256 $runtimeDll.FullName).Hash.ToLowerInvariant()
                if ((Get-FileHash -Algorithm SHA256 $runtimePath).Hash.ToLowerInvariant() -ne $expectedHash) { throw "Packaged VC runtime hash differs from the selected Visual Studio redistributable: $runtimePath" }
                Write-Host "App-local VC runtime $runtimePath machine=0xAA64 SHA-256=$expectedHash"
              }
            }
          }
          $feed = Get-Content (Join-Path $output 'latest.yml') -Raw
          $entry = [regex]::Match($feed, "(?ms)^\s*-\s+url:\s*$([regex]::Escape($installer.Name))\s*\r?\n\s+sha512:\s*(\S+)\s*\r?\n\s+size:\s*(\d+)")
          if (-not $entry.Success) { throw 'latest.yml has no complete matching installer entry.' }
          $declaredSize = [long]$entry.Groups[2].Value
          Write-Host "Feed installer url=$($installer.Name) declaredSize=$declaredSize actualSize=$($installer.Length)"
          if ($declaredSize -ne $installer.Length) { throw 'latest.yml installer size does not match the produced installer.' }
          $sha512 = [Security.Cryptography.SHA512]::Create()
          $stream = [IO.File]::OpenRead($installer.FullName)
          try { $actualSha512 = [Convert]::ToBase64String($sha512.ComputeHash($stream)) } finally { $stream.Dispose(); $sha512.Dispose() }
          Write-Host "Feed installer sha512=$($entry.Groups[1].Value) actualSha512=$actualSha512"
          if ($entry.Groups[1].Value -ne $actualSha512) { throw 'latest.yml installer SHA-512 does not match the produced installer.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $lines = @("$hash  $($installer.Name)")
          Get-ChildItem $output -Filter '*.blockmap' -File | ForEach-Object { $lines += "$( (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() )  $($_.Name)" }
          $feedDigest = (Get-FileHash -Algorithm SHA256 (Join-Path $output 'latest.yml')).Hash.ToLowerInvariant()
          $lines += "$feedDigest  latest.yml"
          $vcRuntime = if ($env:PACKAGE_ARCH -eq 'arm64') { Get-Content 'node_modules/sherpa-onnx-win-arm64/VC-RUNTIME-PROVENANCE.txt' -Raw } else { $null }
          $vcRuntimeHashes = if ($env:PACKAGE_ARCH -eq 'arm64') { Get-ChildItem 'node_modules/sherpa-onnx-win-arm64/vc-runtime' -Filter '*.dll' -File | ForEach-Object { [ordered]@{ file=$_.Name; sha256=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() } } } else { @() }
          $provenance = [ordered]@{ sourceCommit=$env:RELEASE_SHA; version='0.2.3'; arch=$env:PACKAGE_ARCH; installerSha256=$hash; modelManifestSha256=(Get-FileHash -Algorithm SHA256 'src/main/services/local-asr/model-store.ts').Hash.ToLowerInvariant(); signing='unsigned'; vcRuntimeProvenance=$vcRuntime; vcRuntimeFiles=$vcRuntimeHashes }
          $provenance | ConvertTo-Json | Set-Content (Join-Path $output 'BUILD-PROVENANCE.json') -Encoding utf8
          Set-Content (Join-Path $output "SHA256SUMS-Windows-$env:PACKAGE_ARCH.txt") -Value $lines -Encoding utf8NoBOM
      - name: Retain Windows installer and verification records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenType-Windows-${{ matrix.arch }}-0.2.3-${{ github.sha }}
          path: |
            release/staging/0.2.3/windows-${{ matrix.arch }}/OpenType-0.2.3-Windows-${{ matrix.arch }}.exe
            release/staging/0.2.3/windows-${{ matrix.arch }}/*.blockmap
            release/staging/0.2.3/windows-${{ matrix.arch }}/latest.yml
            release/staging/0.2.3/windows-${{ matrix.arch }}/SHA256SUMS-Windows-${{ matrix.arch }}.txt
            release/staging/0.2.3/windows-${{ matrix.arch }}/BUILD-PROVENANCE.json
          if-no-files-found: error
          retention-days: 7
